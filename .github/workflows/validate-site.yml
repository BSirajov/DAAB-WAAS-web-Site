name: Validate DAAB site

# This workflow does not deploy and does not purge Hostinger or a CDN.
# Production asset versions are stamped by helpers/_build_deployment_folder.py,
# which a deploy workflow must run before uploading Deployment/.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Link and structure checks
        run: |
          python helpers/_validate_site.py
          python helpers/_validate_cv_cards.py
          python helpers/_check_name_order.py
      - name: Asset version stamp check
        run: python helpers/_stamp_asset_versions.py --self-check
